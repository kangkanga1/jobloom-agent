name: Bootstrap Jobloom source

on:
  push:
    branches:
      - main
    paths:
      - jobloom-source.tar.gz

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand and publish source tree
        shell: bash
        run: |
          tar -xzf jobloom-source.tar.gz
          rm -f jobloom-source.tar.gz .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Jobloom Agent source"
          git push origin HEAD:main
